# CI 门禁(2026-09-13,PLAN-20260913201727)。
#
# 为什么要有它:Cloudflare Workers Builds 只在 push 后跑 `npm run build`(typecheck → lint →
# 单测 → 构建),**E2E 一条都不跑**;PR 上此前没有任何检查。于是「改了 UI 要跑受影响 spec」
# 这条规范完全取决于当天有没有人偷懒 —— 本文件是它的兜底。
#
# 两档:
#   PR              → check:ci + **PR 专用** typecheck/lint/单测 + 受影响 spec(chromium,快)
#   push main / 手动 → check:ci + 全量三浏览器体检(chromium + webkit,5–9 min)
#
# ⚠ 与 §2 的关系(2026-09-16 订正,PLAN-20260916003228;2026-10-16 去重):测试职责**已经全部移到云端** ——
#   本地不再跑门禁(§2 / §4.3 已删掉 `pre-push`)。分工是:
#     · Cloudflare Workers Builds = **部署前门禁**(`npm run build`:typecheck / lint / 单测,失败不上线);
#     · 本文件 = **PR 门禁 + 事后体检** —— ⚠ `main` 上的 E2E 红了**不会回滚已经上线的版本**,
#       所以它报红之后要**优先修**,别继续叠改动(§8 红线 1)。
#
# ⚠ 2026-10-16:gate job **不再在 push main 时重跑 typecheck / lint / 单测** ——
#   Workers Builds 已经在**部署前**跑过同一批命令(§2),CI 再跑一遍只是把同一批命令等第二次,
#   零信息增量。这里只留 CF 不跑的两样(check:repo / check:test-map)。
#   PR 例外:PR 分支的 Workers Builds 不保证存在(它只负责 main 的部署前门禁),
#   所以 `pull_request` 上 CI 必须自己把 typecheck / lint / 单测补上 —— 见 gate 的第二个 step。

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: 门禁(仓库卫生 · 测试映射 · PR 才跑 typecheck/lint/单测)
    runs-on: ubuntu-latest
    outputs:
      # 供 e2e 判断「这次改动有没有可能影响 UI」。漏算的代价是多跑一次 E2E,算错的代价是**漏跑**,
      # 所以下面拿不到可靠基线时一律退化成「当成改了」。
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 HEAD^ 才能 diff 出本次改动的路径
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          # 与本地一致(v24.x);tests/schema.test.ts 依赖 node:sqlite
          node-version: 24
          cache: npm
      - run: npm ci
      # Cloudflare Workers Builds 不跑的那两样(见文件头「去重」说明)。
      - run: npm run check:ci
      # PR 专用:见文件头 —— PR 分支没有「部署前门禁」兜底,所以这三样得 CI 自己跑。
      - name: typecheck / lint / 单测(PR 专用)
        if: github.event_name == 'pull_request'
        run: npm run verify:code
      - name: 算出本次改动路径(供 e2e 跳过纯文档 / 工具链提交)
        id: scope
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "changed<<EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only HEAD^ HEAD >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            # 首个提交 / 浅克隆拿不到基线 → 当成「全都改了」,宁多跑不漏跑
            echo "changed<<EOF" >> "$GITHUB_OUTPUT"
            echo "apps/ packages/" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
          echo "--- 本次改动 ---"
          git diff --name-only HEAD^ HEAD 2>/dev/null || echo "(拿不到基线)"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: gate
    # 只有碰到应用代码 / 测试代码才值得跑(2026-10-16,§2):文档 / CI / 脚本改动的提交,
    # 三浏览器全量 E2E 一条都不可能因此变红,却要占满整条 runner 队列(绿 5–9 min,红 27–29 min)。
    # ⚠ 这是**唯一**允许的瘦身:降浏览器档(chromium-only)会把 mobile-webkit 的红藏起来,不做。
    # ⚠ `e2e/` 必须算进来:改 spec 本身也是「改了测试」—— 只改它的提交在 main 上若整条 job 不启动,
    #   那个改动就永远没人验(PR 侧由 affected-specs 的 selfSpecPrefixes 兜,main 侧只能靠这里)。
    if: |
      github.event_name != 'push' ||
      contains(needs.gate.outputs.changed, 'apps/') ||
      contains(needs.gate.outputs.changed, 'packages/') ||
      contains(needs.gate.outputs.changed, 'e2e/')
    steps:
      - uses: actions/checkout@v4
        with:
          # affected-specs 要 diff 出 base 分支,浅克隆拿不到 merge-base
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 安装浏览器
        run: npx playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}
      - name: 构建 web(E2E 吃 dist/,先 build 再 preview)
        run: npm run build -w @biff/web

      - name: 全量三浏览器(push main / 手动触发)
        # 不调 `npm run verify:full`:那会再 build 一遍,而 `build --workspaces` 里的
        # `@biff/api` 走的是 `wrangler deploy --dry-run` —— GitHub Actions 没有 Cloudflare
        # 凭据,不该在 CI 里赌它能不能跑。typecheck / lint / 单测由 Cloudflare 在**部署前**覆盖
        # (PR 上则由 gate 的第二个 step 覆盖),api 的打包由 Cloudflare 自己的构建负责。
        if: github.event_name != 'pull_request'
        run: npx playwright test -c playwright.react.config.ts

      - name: 受影响 spec · desktop-chromium(PR)
        # ⚠ 只在 pull_request 上跑:`github.base_ref` 只在 PR 事件里有值。
        if: github.event_name == 'pull_request'
        run: |
          SPECS=$(node scripts/affected-specs.mjs --base "origin/${{ github.base_ref }}" | grep '^e2e/' | tr '\n' ' ')
          echo "必跑 spec:$SPECS"
          npx playwright test -c playwright.react.config.ts $SPECS --project=desktop-chromium

      - name: 失败时保留报告与 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
