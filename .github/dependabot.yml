# 依赖更新(2026-09-13,PLAN-20260913201727)。
#
# 为什么要有它:`wrangler 4.131.1` / `@playwright/test 1.63.0` 这类版本是**pin 死**的,
# 而且此前没有任何机制会把安全补丁推过来 —— 全靠有人想起来。这不是「要不要自动化」的问题,
# 是「什么时候被漏掉」的问题。
#
# 设计口径:
# - **按月**(不是每周):这是自用工具,依赖噪声比及时性更贵。
# - **分组**:把 react 全家桶与工具链各合成一个 PR —— 否则一次月度跑会开出十几个 PR,
#   每个都要过一遍 CI(而且 `package-lock.json` 命中 test-map 的 allOn → 每个 PR 跑全量 E2E)。
# - **提交信息带 scope**:`include: scope` → `build(react): bump …`,
#   与本仓库 §4 的 `<type>(<scope>): <描述>` 形态一致。
#
# ⚠ 私有仓库需要在 Settings → Code security 里启用 Dependabot,本文件才会生效。

version: 2
updates:
  - package-ecosystem: npm
    # 根目录即可:npm workspaces 的依赖由根 package-lock.json 统一解析,
    # apps/* 与 packages/* 的 package.json 都在同一棵树下。
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router
          - react-aria-components
          - "@react-aria/*"
          - "@react-spectrum/*"
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - typescript
          - eslint
          - eslint-plugin-*
          - typescript-eslint
          - vitest
          - "@playwright/test"
          - vite
          - vite-plugin-*
          - wrangler
          - drizzle-kit
          - tailwindcss
          - "@tailwindcss/*"
          - lightningcss
          - zod
    ignore:
      # 本地 workspace 包,不是外部依赖
      - dependency-name: "@biff/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
