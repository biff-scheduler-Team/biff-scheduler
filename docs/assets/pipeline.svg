<svg width="960" height="190" viewBox="0 0 960 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">数据与部署管线</title>
  <desc id="pipeDesc">离线 Python 脚本把 biff.kr 官方页面与官方 xlsx 变成只读 JSON，Vite 构建后随 Cloudflare Workers 上线。</desc>
  <rect width="960" height="190" fill="#f6f8fa" rx="12" />

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 输入 -->
    <rect x="24" y="40" width="170" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" />
    <text x="109" y="68" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">biff.kr 官网</text>
    <text x="109" y="88" font-size="11" fill="#4b5563" text-anchor="middle">排期页 + 影片信息 xlsx</text>

    <!-- 离线脚本 -->
    <rect x="238" y="40" width="200" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" />
    <text x="338" y="68" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">tools/*.py（离线）</text>
    <text x="338" y="88" font-size="11" fill="#4338ca" text-anchor="middle">抓取 / 归一 / 自检 → 写 JSON</text>

    <!-- JSON -->
    <rect x="482" y="40" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" />
    <text x="582" y="62" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">apps/web/public/*.json</text>
    <text x="582" y="80" font-size="11" fill="#4b5563" text-anchor="middle">schedule · venues · films</text>
    <text x="582" y="96" font-size="11" fill="#4b5563" text-anchor="middle">douban · festival-extras</text>

    <!-- 构建 -->
    <rect x="726" y="40" width="150" height="64" rx="10" fill="#fff7ed" stroke="#f97316" />
    <text x="801" y="68" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">git push main</text>
    <text x="801" y="88" font-size="11" fill="#9a3412" text-anchor="middle">Workers Builds 构建</text>

    <!-- 连线 -->
    <g stroke="#9ca3af" stroke-width="2" fill="none">
      <path d="M194 72 L230 72" marker-end="url(#arrow)" />
      <path d="M438 72 L474 72" marker-end="url(#arrow)" />
      <path d="M682 72 L718 72" marker-end="url(#arrow)" />
      <path d="M876 72 L906 72 L906 140 L560 140" marker-end="url(#arrow)" stroke-dasharray="6 4" />
    </g>

    <!-- 线上 -->
    <rect x="360" y="118" width="200" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" />
    <text x="460" y="138" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">biff.lcandy.co</text>
    <text x="460" y="156" font-size="11" fill="#166534" text-anchor="middle">前端 Worker + API Worker + D1</text>

    <!-- 本地片单 -->
    <rect x="24" y="118" width="200" height="48" rx="10" fill="#ffffff" stroke="#d1d5db" />
    <text x="124" y="138" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">浏览器 localStorage</text>
    <text x="124" y="156" font-size="11" fill="#4b5563" text-anchor="middle">选片 / 排片（默认只存本机）</text>

    <text x="244" y="155" font-size="11" fill="#6b7280">登录 IFFDAY 后才同步</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
  </defs>
</svg>
