<svg width="960" height="330" viewBox="0 0 960 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boardTitle boardDesc">
  <title id="boardTitle">榜单页示意</title>
  <desc id="boardDesc">榜单页三个 tab（热门榜 / 红榜 / 黑榜），页头的快速投票、排行榜、生成分享图入口，以及红黑贴纸卡片与排行榜 TOP 列。</desc>
  <rect width="960" height="330" fill="#f6f8fa" rx="12" />

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- tab -->
    <rect x="24" y="20" width="300" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" />
    <rect x="30" y="25" width="90" height="26" rx="13" fill="#111827" />
    <text x="75" y="42" font-size="12" fill="#ffffff" text-anchor="middle">热门榜</text>
    <text x="160" y="42" font-size="12" fill="#4b5563" text-anchor="middle">红榜</text>
    <text x="250" y="42" font-size="12" fill="#4b5563" text-anchor="middle">黑榜</text>

    <!-- 页头入口 -->
    <rect x="600" y="20" width="104" height="36" rx="18" fill="#e8455c" />
    <text x="652" y="43" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">快速投票</text>
    <rect x="712" y="20" width="104" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" />
    <text x="764" y="43" font-size="12" fill="#111827" text-anchor="middle">排行榜</text>
    <rect x="824" y="20" width="112" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" />
    <text x="880" y="43" font-size="12" fill="#111827" text-anchor="middle">生成分享图</text>

    <!-- 红黑贴纸卡 -->
    <rect x="24" y="76" width="290" height="140" rx="12" fill="#ffffff" stroke="#d1d5db" />
    <rect x="40" y="92" width="70" height="105" rx="6" fill="#e5e7eb" />
    <circle cx="200" cy="150" r="34" fill="#e8455c" />
    <text x="200" y="156" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">红</text>
    <text x="40" y="222" font-size="12" fill="#4b5563">雾中风景 · 红 128 · 黑 9</text>

    <rect x="330" y="76" width="290" height="140" rx="12" fill="#ffffff" stroke="#d1d5db" />
    <rect x="346" y="92" width="70" height="105" rx="6" fill="#e5e7eb" />
    <circle cx="506" cy="150" r="34" fill="#111827" />
    <text x="506" y="156" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">黑</text>
    <text x="346" y="222" font-size="12" fill="#4b5563">母亲 · 红 4 · 黑 61</text>

    <!-- 快速投票滑动 -->
    <rect x="640" y="76" width="296" height="140" rx="12" fill="#ffffff" stroke="#e8455c" stroke-width="1.5" />
    <text x="788" y="104" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">快速投票 · 一张一张划</text>
    <text x="700" y="140" font-size="12" fill="#4b5563">左滑 = 黑</text>
    <text x="700" y="162" font-size="12" fill="#4b5563">右滑 = 红</text>
    <text x="700" y="184" font-size="12" fill="#4b5563">上滑 = 跳过</text>
    <rect x="820" y="128" width="44" height="28" rx="6" fill="#e8455c" />
    <text x="842" y="146" font-size="11" fill="#ffffff" text-anchor="middle">红</text>
    <rect x="870" y="128" width="44" height="28" rx="6" fill="#111827" />
    <text x="892" y="146" font-size="11" fill="#ffffff" text-anchor="middle">黑</text>

    <!-- 排行榜 TOP -->
    <rect x="24" y="232" width="596" height="82" rx="12" fill="#101013" />
    <text x="44" y="258" font-size="12" font-weight="700" fill="#ce1e36">排行榜</text>
    <g font-size="12">
      <text x="120" y="280" fill="#e8455c" font-weight="700">01</text>
      <rect x="150" y="266" width="24" height="34" rx="3" fill="#2a2a30" />
      <text x="186" y="280" fill="#e9e9ef">雾中风景</text>
      <text x="300" y="280" fill="#e8455c">红 128</text>
      <text x="368" y="280" fill="#c7c7d0">黑 9</text>

      <text x="120" y="303" fill="#c7c7d0" font-weight="700">02</text>
      <rect x="150" y="289" width="24" height="34" rx="3" fill="#2a2a30" />
      <text x="186" y="303" fill="#e9e9ef">母亲</text>
      <text x="300" y="303" fill="#e8455c">红 4</text>
      <text x="368" y="303" fill="#c7c7d0">黑 61</text>
    </g>
    <text x="470" y="280" font-size="11" fill="#8a8a96">红榜 TOP50 · 双栏出图</text>

    <!-- 分享图 -->
    <rect x="640" y="232" width="120" height="82" rx="10" fill="#ffffff" stroke="#d1d5db" />
    <rect x="646" y="238" width="108" height="10" rx="3" fill="#ce1e36" />
    <rect x="656" y="256" width="48" height="46" rx="3" fill="#e5e7eb" />
    <rect x="712" y="258" width="36" height="6" rx="3" fill="#d1d5db" />
    <rect x="712" y="270" width="30" height="6" rx="3" fill="#e5e7eb" />
    <text x="784" y="278" font-size="11" fill="#4b5563">1080 宽长图</text>
    <text x="784" y="296" font-size="11" fill="#4b5563">按单元切分</text>
  </g>
</svg>
