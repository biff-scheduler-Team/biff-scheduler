  <!-- 主题:首屏防闪白 —— 必须在样式表**之前**把 data-theme 落到 <html>(CSS 唯一入口见 style.css 末尾)。
       「跟随系统」在这里就地解析成亮 / 暗;随后 src/theme.ts 接管系统外观变化监听与三态切换。
       偏好与其它设置同一份(localStorage `biff.settings.v1`),故这里直接读它,不另设 key。 -->
  <script data-page-node-id="th3meBoot0000000000001">
    (function () {
      try {
        var raw = localStorage.getItem("biff.settings.v1");
        var pref = (raw && JSON.parse(raw).theme) || "system";
        var dark = pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePref = pref;
      } catch (err) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
