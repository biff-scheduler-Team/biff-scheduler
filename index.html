<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#ce1e36" />
    <title>BIFF Scheduler, 2026 釜山电影节排片</title>
    <link rel="icon" type="image/svg+xml" href="/brand/biff-scheduler-seal.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      try {
        var settings = JSON.parse(localStorage.getItem('biff.settings.v1') || '{}');
        var dark = settings.theme === 'dark' || (settings.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.colorScheme = dark ? 'dark' : 'light';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
